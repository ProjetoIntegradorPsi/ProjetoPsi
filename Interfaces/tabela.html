<!DOCTYPE html>
<html >
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Laboratório de Piscicultura</title>

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                justify-content: center;
                text-align: center;
                font-family: 'Franklin Gothic Medium', Arial, sans-serif;
                background-color: #f5f5f5;
            }

            .container {
                width: 100%;
                max-width: 900px;
                padding: 20px;
            }

            .titulo {
                position: relative;
                width: 100%;
                max-width: 700px;
                margin: 0 auto 20px;
            }

            .titulo img {
                display: block;
                width: 100%;
                height: 180px;
                object-fit: cover;
                border-radius: 15px;
            }

            .texto-sobreposto {
                position: absolute;
                inset: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                color: white;
                font-weight: bold;
                font-size: 28px;
                background-color: rgba(0, 0, 0, 0.5);
                border-radius: 15px;
            }

            .pesquisa {
                display: flex;
                justify-content: center;
                gap: 8px;
                margin-bottom: 20px;
            }

            .pesquisa input {
                width: 300px;
                padding: 10px;
                border-radius: 5px;
                font-size: 16px;
            }

            button {
                padding: 10px 15px;
                color: black;
                font-weight: bold;
                border-radius: 5px;
                background-color: aquamarine;
                cursor: pointer;
            }

            button:hover {
                background-color: #66d9c0;
                transform: scale(1.05);
            }

            /* Caixa da tabela */
            .caixa {
                width: 100%;
                max-width: 900px;
                height: 45vh;
                margin: 0 auto;
                overflow-y: auto;
                overflow-x: auto;
                border: 2px solid black;
                background-color: white;
            }

            /* Tabela */
            table {
                width: 100%;
                border-collapse: collapse;
                min-width: 700px;
            }

            th {
                border: 2px solid black;
                padding: 10px;
                background-color: aquamarine;
                position: sticky;
                top: 0;
                z-index: 2;
            }

            td {
                border: 1px solid black;
                padding: 8px;
            }

            tbody tr:nth-child(even) {
                background-color: #f0f0f0;
            }

            /* Botões inferiores */
            .botoes {
                margin-top: 20px;
                display: flex;
                justify-content: center;
                gap: 15px;
            }

            /* Responsividade */
            @media (max-width: 600px) {

                .container {
                    padding: 10px;
                }

                .texto-sobreposto {
                    font-size: 20px;
                }

                .titulo img {
                    height: 130px;
                }

                .pesquisa {
                    flex-direction: column;
                    align-items: center;
                }

                .pesquisa input {
                    width: 100%;
                    max-width: 350px;
                }

                .botoes {
                    flex-direction: column;
                    align-items: center;
                }
            }
        </style>
    </head>

    <body>

        <div class="container">

            <!-- Cabeçalho -->
            <div class="titulo">
                <img src="https://www.ufsm.br/app/uploads/sites/668/2019/07/1170x308-crop-90-images_banner_3.jpg" alt="Laboratório de Piscicultura - UFSM">
                <div class="texto-sobreposto">Piscicultura - UFSM</div>
            </div>


            <!-- Pesquisa -->
            <div class="pesquisa">
                <input type="text" placeholder="Buscar..." onkeyup="pesquisarTabela()" id="campoBusca">
                <button type="button" onclick="pesquisarTabela()">Pesquisar</button>
            </div>


            <!-- Tabela -->
            <div class="caixa">

                <table id="mytabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Data e Hora</th>
                            <th>Temperatura Interna [°C]</th>
                            <th>Temperatura Externa [°C]</th>
                            <th>pH</th>
                            <th>Oxigênio [mg/L]</th>
                            <th>Tensão [V]</th>
                            <th>Corrente [A]</th>
                            <th>Potência [W]</th>
                            <th>Condutividade Elétrica [μS/cm]</th>
                        </tr>
                    </thead>

                    <tbody id="corpoTabela">
                        
                    </tbody>

                </table>

            </div>


            <!-- Botões -->
            <div class="botoes">

                <button type="button" onclick="baixarTabelaCSV()">Baixar</button>

            </div>

        </div>

        <script>
            function baixarTabelaCSV(){
                const tabela = document.getElementById('mytabela');
                let linhasCSV = [];
        
                for(let linhas of tabela.rows){
                    let dadosLinha = [];
                    for(let celula of linhas.cells){
                        let texto = celula.innerText.replace(/(\r\n|\n|\r)/gm, "").replace(/"/g, '""');
                        dadosLinha.push('"' + texto + '"');
                    }
                    linhasCSV.push(dadosLinha.join(';')); 
                }
                const conteudo = "\uFEFF" + linhasCSV.join('\n');
                const arquivo = new Blob([conteudo], { type: 'text/csv;charset=utf-8;' });
        
                const link = document.createElement('a');
                link.href = URL.createObjectURL(arquivo);
                link.download = 'dados-da-tabela.csv';

                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            function pesquisarTabela() {
              const pesquisa = document
              .getElementById("campoBusca")
              .value.toLowerCase();

              const tabela = document.getElementById("mytabela");
              const linhas = tabela.getElementsByTagName("tbody")[0].getElementsByTagName("tr");

              for (let i = 0; i < linhas.length; i++) {
                 const texto = linhas[i].innerText.toLowerCase();

                if (texto.includes(pesquisa)) {
                  linhas[i].style.display = "";
                } else {
                  linhas[i].style.display = "none";
                }
              } 
            }

          async function atualizarTabela(){
            try {
              const resposta = await fetch("/dados");
              if (!resposta.ok) throw new Error("Erro HTTP: " + resposta.status);
                const dados = await resposta.json();      // agora é uma lista

                const tbody = document.getElementById("corpoTabela");
                tbody.innerHTML = "";

                dados.forEach(d => {
                const linha = document.createElement("tr");
                [d.nome, d.hora, d.temperatura_interna, d.temperatura_externa, d.ph, d.oxigenio,
                d.tensao, d.corrente, d.potencia, d.condutividade].forEach(v => {
                  const td = document.createElement("td");
                  td.textContent = v ?? "N/A";
                  linha.appendChild(td);
                });
                tbody.appendChild(linha);
              });

              pesquisarTabela();   // reaplica o filtro depois de recarregar
            } catch (erro) {
              console.error("Erro ao atualizar tabela:", erro);
            }
            setTimeout(atualizarTabela, 5000);
          }

          atualizarTabela();
          
        </script>

    </body>

</html>
